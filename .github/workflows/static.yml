# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Create public Supabase config
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_TABLE: ${{ vars.SUPABASE_TABLE }}
        run: node -e "const fs=require('node:fs');const url=(process.env.SUPABASE_URL||'').trim();const publishableKey=(process.env.SUPABASE_PUBLISHABLE_KEY||'').trim();const table=(process.env.SUPABASE_TABLE||'wedding_rsvps').trim();if(!url||!publishableKey)throw new Error('Missing SUPABASE_URL or SUPABASE_PUBLISHABLE_KEY');fs.writeFileSync('scripts/supabase-config.js','window.SUPABASE_CONFIG = '+JSON.stringify({url,publishableKey,table},null,2)+';\\n');"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
