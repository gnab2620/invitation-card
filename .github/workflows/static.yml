# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Create public Supabase config
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || vars.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_TABLE: ${{ vars.SUPABASE_TABLE || secrets.SUPABASE_TABLE }}
        run: node -e "const fs=require('node:fs');const url=(process.env.SUPABASE_URL||'').trim();const publishableKey=(process.env.SUPABASE_PUBLISHABLE_KEY||'').trim();const table=(process.env.SUPABASE_TABLE||'wedding_rsvps').trim();if(!url||!publishableKey)throw new Error('Missing SUPABASE_URL or SUPABASE_PUBLISHABLE_KEY');fs.writeFileSync('scripts/supabase-config.js','window.SUPABASE_CONFIG = '+JSON.stringify({url,publishableKey,table},null,2)+';\\n');for(const indexPath of ['index.html','table/index.html']){const index=fs.readFileSync(indexPath,'utf8').replaceAll('__DEPLOY_VERSION__',process.env.GITHUB_SHA||Date.now().toString());fs.writeFileSync(indexPath,index);}"
      - name: Upload Pages artifact
        id: upload
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages
          # Upload the repository root, including the root index.html
          path: '.'
      - name: Verify Pages artifact upload
        env:
          PAGES_ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        run: test -n "$PAGES_ARTIFACT_ID"

  deploy:
    needs: build
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages
