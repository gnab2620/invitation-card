<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#00508c">
  <title>Thiệp cưới Tuấn Long & Phương Thảo</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="preload" as="image" href="assets/background.png">
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>
  <main class="invitation-shell" aria-label="Thiệp cưới Tuấn Long và Phương Thảo">
    <section class="invitation-card" aria-label="Nội dung thiệp cưới">
      <img class="invitation-background" src="assets/background.png" width="2331" height="14892" fetchpriority="high" alt="" aria-hidden="true">
      <img class="invitation-layer invitation-layer--one" src="assets/section-1.png" alt="Trân trọng báo tin lễ thành hôn của hai con chúng tôi" width="890" height="1011" decoding="async">
      <!-- <div class="family-details" aria-label="Thông tin gia đình hai bên">
        <p><strong>NHÀ TRAI</strong><span>Ông Đỗ Tuấn Sơn<br>Bà Nguyễn T. Lan Anh</span></p>
        <p><strong>NHÀ GÁI</strong><span>Ông Hồ Đình Bằng<br>Bà Nguyễn T. Thúy Ngân</span></p>
      </div> -->
      <img class="invitation-layer invitation-layer--two" src="assets/section-2.png" alt="Chú rể Tuấn Long và cô dâu Phương Thảo" width="877" height="1289" decoding="async">
      <img class="invitation-layer invitation-layer--three" src="assets/section-3.png" alt="Gia đình rất hân hạnh được đón tiếp" width="913" height="971" decoding="async">

      <div class="album-stage" aria-label="Album ảnh cưới">
        <div class="album-photo-window">
          <img class="album-slide is-active" src="assets/Pre0276.jpg" width="4541" height="6812" loading="lazy" decoding="async" alt="Ảnh cưới 1">
          <img class="album-slide" src="assets/Pre0295.jpg" width="4541" height="6812" loading="lazy" decoding="async" alt="Ảnh cưới 2">
          <img class="album-slide" src="assets/Pre0546.jpg" width="4541" height="6812" loading="lazy" decoding="async" alt="Ảnh cưới 3">
          <img class="album-slide" src="assets/Pre0794.jpg" width="4565" height="6847" loading="lazy" decoding="async" alt="Ảnh cưới 4">
          <img class="album-slide" src="assets/Pre1018.jpg" width="4409" height="5879" loading="lazy" decoding="async" alt="Ảnh cưới 5">
        </div>
        <img class="album-frame" src="assets/album-frame.png" alt="" aria-hidden="true">
        <div class="album-dots" aria-hidden="true">
          <span class="is-active"></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
        </div>
      </div>

      <button class="rsvp-design-button" type="button" aria-haspopup="dialog" aria-controls="rsvpDialog">
        Xác nhận tham dự
      </button>
      <img class="invitation-layer invitation-layer--four" src="assets/section-4.png" alt="Cùng chung vui trong ngày cưới" width="999" height="1255" decoding="async">
    </section>
  </main>

  <div class="rsvp-dialog" id="rsvpDialog" role="dialog" aria-modal="true" aria-labelledby="rsvpTitle" hidden>
    <div class="rsvp-dialog__backdrop" data-rsvp-close></div>
    <form class="rsvp-dialog__panel" id="rsvpForm">
      <h2 class="sr-only" id="rsvpTitle">Xác nhận tham dự</h2>

      <label class="rsvp-field rsvp-name-field">
        <span class="sr-only">Họ và tên</span>
        <input class="rsvp-name-input" type="text" name="fullName" autocomplete="name" required>
      </label>

      <fieldset class="rsvp-attendance">
        <legend class="sr-only">Bạn sẽ tham dự chứ?</legend>

        <label class="rsvp-radio rsvp-radio--yes">
          <input type="radio" name="attendance" value="yes" checked>
          <span aria-hidden="true"></span>
          <span class="sr-only">Có</span>
        </label>

        <label class="rsvp-radio rsvp-radio--no">
          <input type="radio" name="attendance" value="no">
          <span aria-hidden="true"></span>
          <span class="sr-only">Không</span>
        </label>
      </fieldset>

      <label class="rsvp-field rsvp-count-field">
        <span class="sr-only">Số lượng người tham dự</span>
        <select class="rsvp-count-select" name="guestCount">
          <option value="1">1 người</option>
          <option value="2">2 người</option>
          <option value="3">3 người</option>
          <option value="4">4 người</option>
          <option value="5">5 người</option>
        </select>
      </label>

      <button class="rsvp-submit" type="submit">Gửi xác nhận</button>
      <p class="rsvp-status" id="rsvpStatus" role="status" aria-live="polite"></p>
    </form>
  </div>

  <script src="scripts/supabase-config.js?v=__DEPLOY_VERSION__"></script>
  <script src="scripts/main.js"></script>
</body>
</html>
