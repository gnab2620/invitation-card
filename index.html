<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#00508c">
  <title>Thiệp cưới Tuấn Long & Phương Thảo</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link
    rel="preload"
    as="image"
    href="assets/main-page-860.avif"
    type="image/avif"
    imagesrcset="assets/main-page-430.avif 430w, assets/main-page-860.avif 860w"
    imagesizes="(max-width: 430px) 100vw, 430px"
  >
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>
  <main class="invitation-shell" aria-label="Thiệp cưới Tuấn Long và Phương Thảo">
    <section class="invitation-card" aria-label="Nội dung thiệp cưới">
      <picture class="invitation-design-picture">
        <source
          type="image/avif"
          srcset="assets/main-page-430.avif 430w, assets/main-page-860.avif 860w"
          sizes="(max-width: 430px) 100vw, 430px"
        >
        <img
          class="invitation-design"
          src="assets/main-page-860.webp"
          srcset="assets/main-page-430.webp 430w, assets/main-page-860.webp 860w"
          sizes="(max-width: 430px) 100vw, 430px"
          width="2331"
          height="14892"
          fetchpriority="high"
          decoding="async"
          alt="Thiệp cưới Tuấn Long và Phương Thảo"
        >
      </picture>

      <div class="album-stage" aria-label="Album ảnh cưới">
        <div class="album-photo-window">
          <img class="album-slide is-active" src="assets/album-1-640.webp" srcset="assets/album-1-320.webp 320w, assets/album-1-640.webp 640w" sizes="(max-width: 430px) 65vw, 278px" width="784" height="1153" loading="lazy" decoding="async" alt="Ảnh cưới 1">
          <img class="album-slide" src="assets/album-2-640.webp" srcset="assets/album-2-320.webp 320w, assets/album-2-640.webp 640w" sizes="(max-width: 430px) 65vw, 278px" width="785" height="1153" loading="lazy" decoding="async" alt="Ảnh cưới 2">
          <img class="album-slide" src="assets/album-3-640.webp" srcset="assets/album-3-320.webp 320w, assets/album-3-640.webp 640w" sizes="(max-width: 430px) 65vw, 278px" width="785" height="1153" loading="lazy" decoding="async" alt="Ảnh cưới 3">
          <img class="album-slide" src="assets/album-4-640.webp" srcset="assets/album-4-320.webp 320w, assets/album-4-640.webp 640w" sizes="(max-width: 430px) 65vw, 278px" width="784" height="1153" loading="lazy" decoding="async" alt="Ảnh cưới 4">
          <img class="album-slide" src="assets/album-5-640.webp" srcset="assets/album-5-320.webp 320w, assets/album-5-640.webp 640w" sizes="(max-width: 430px) 65vw, 278px" width="784" height="1153" loading="lazy" decoding="async" alt="Ảnh cưới 5">
          <img class="album-slide" src="assets/album-6-640.webp" srcset="assets/album-6-320.webp 320w, assets/album-6-640.webp 640w" sizes="(max-width: 430px) 65vw, 278px" width="784" height="1153" loading="lazy" decoding="async" alt="Ảnh cưới 6">
        </div>
        <!-- <img class="album-frame" src="assets/album-frame.png" alt="" aria-hidden="true"> -->
        <div class="album-dots" aria-hidden="true">
          <span class="is-active"></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
        </div>
      </div>

      <button class="rsvp-design-button" type="button" aria-haspopup="dialog" aria-controls="rsvpDialog">
        Xác nhận tham dự
      </button>
    </section>
  </main>

  <div class="rsvp-dialog" id="rsvpDialog" role="dialog" aria-modal="true" aria-labelledby="rsvpTitle" hidden>
    <div class="rsvp-dialog__backdrop" data-rsvp-close></div>
    <form class="rsvp-dialog__panel" id="rsvpForm">
      <h2 class="sr-only" id="rsvpTitle">Xác nhận tham dự</h2>

      <label class="rsvp-field rsvp-name-field">
        <span class="sr-only">Họ và tên</span>
        <input class="rsvp-name-input" type="text" name="fullName" autocomplete="name" required>
      </label>

      <fieldset class="rsvp-attendance">
        <legend class="sr-only">Bạn sẽ tham dự chứ?</legend>

        <label class="rsvp-radio rsvp-radio--yes">
          <input type="radio" name="attendance" value="yes" checked>
          <span aria-hidden="true"></span>
          <span class="sr-only">Có</span>
        </label>

        <label class="rsvp-radio rsvp-radio--no">
          <input type="radio" name="attendance" value="no">
          <span aria-hidden="true"></span>
          <span class="sr-only">Không</span>
        </label>
      </fieldset>

      <label class="rsvp-field rsvp-count-field">
        <span class="sr-only">Số lượng người tham dự</span>
        <select class="rsvp-count-select" name="guestCount">
          <option value="1">1 người</option>
          <option value="2">2 người</option>
          <option value="3">3 người</option>
          <option value="4">4 người</option>
          <option value="5">5 người</option>
        </select>
      </label>

      <button class="rsvp-submit" type="submit">Gửi xác nhận</button>
      <p class="rsvp-status" id="rsvpStatus" role="status" aria-live="polite"></p>
    </form>
  </div>

  <script src="scripts/main.js"></script>
</body>
</html>
